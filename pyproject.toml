[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-project-sanitizer"
version = "0.1.0"
description = "Local reversible sanitization of web project folders"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
web-sanitizer = "web_sanitizer.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["web_sanitizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
